name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & lint
        run: npm run check && npm run lint

      - name: Build (Vercel / Node target)
        run: npm run build

      - name: Build (GitHub Pages static export target)
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Run automated smoke & integrity tests
        run: npm test
